<!-- src/app/components/game-board/game-board.component.html -->
<div class="game-board-outer-container">
  <div class="game-board-container">
    <div class="board-grid" #boardGridElement [ngStyle]="boardStyle"
         [class.board-dragging]="draggingTeamId !== null">

      @for (currentCase of cases; track currentCase.id) {
        <app-case [caseData]="currentCase"></app-case>
      } @empty {
        <p>Chargement du plateau...</p>
      }

      <!-- Fil d'Ariane animé -->
      @if (boardPathD) {
        <svg class="board-path-svg" aria-hidden="true">
          <defs>
            <!-- Filtre glow -->
            <filter id="path-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Halo de fond (épaisseur + flou = effet lumineux) -->
          <path [attr.d]="boardPathD" class="board-path-halo" />

          <!-- Ligne principale animée -->
          <path [attr.d]="boardPathD" class="board-path-line" filter="url(#path-glow)" />

        </svg>
      }

      @for (team of teams; track team.id) {
        <app-pawn
          [teamData]="team"
          [position]="getPawnPosition(team.id)"
          [isDragging]="draggingTeamId === team.id"
          (mousedown)="onPawnMouseDown($event, team.id)">
        </app-pawn>
      }
    </div>
  </div>

  <app-team-control-bar
    [teams]="teams"
    [showAxelCases]="showAxelCases"
    (addTeamRequest)="handleAddNewTeamRequest()"
    (removeTeamRequest)="handleRemoveTeamRequest($event)"
    (updateTeamNameRequest)="handleUpdateTeamNameRequest($event)"
    (updateTeamColorRequest)="handleUpdateTeamColorRequest($event)"
    (moveTeamRequest)="handleMoveTeamRequest($event)"
    (updateTeamIconRequest)="handleUpdateTeamIconRequest($event)"
    (resetTeamsRequest)="handleResetTeamsRequest()"
    (toggleAxelCasesRequest)="handleToggleAxelCasesRequest()"
    (regenerateBoardRequest)="handleRegenerateBoardRequest()">
  </app-team-control-bar>
</div>
